query getNodesUsingCredential($credentialId: jsonb!) {
  device_specific_config_node(
    where: {
      values: {
        config_key: {_eq: "scCredential"}
        config_value: {_eq: $credentialId}
      }
    }
    order_by: [
      {display_name: asc}
      {id: asc}
    ]
  ) {
    id
    node_type
    object_key
    parent_id
    display_name
    sort_order
  }
}
