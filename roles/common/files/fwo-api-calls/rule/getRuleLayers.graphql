query getRuleLayers(
  $managementId: Int!
  $ruleUids: [String!]!
  $ruleLimit: Int!
  $linkLimit: Int!
) {
  rules: firewall_rule(
    limit: $ruleLimit
    where: {
      mgm_id: { _eq: $managementId }
      rule_uid: { _in: $ruleUids }
      removed: { _is_null: true }
      access_rule: { _eq: true }
    }
    order_by: { rule_id: asc }
  ) {
    rule_uid
    rulebase_id
    rulebase {
      id
      uid
      name
    }
  }
  sectionLinks: firewall_rulebase_link(
    limit: $linkLimit
    where: {
      is_section: { _eq: true }
      removed: { _is_null: true }
      rulebase: { mgm_id: { _eq: $managementId } }
    }
    order_by: { id: asc }
  ) {
    from_rulebase_id
    rulebaseByFromRulebaseId {
      id
      uid
      name
    }
    rulebase {
      id
      uid
      name
    }
  }
}
