mutation deleteRuleOwnership($ownerId: Int!, $ruleMetadataId: bigint!, $removed: bigint!) {
  delete_rule_owner(
    where: {
      owner_id: { _eq: $ownerId }
      rule_metadata_id: { _eq: $ruleMetadataId }
      owner_mapping_source_id: { _eq: 4 }
      removed: { _is_null: true }
    }
        _set: {
      removed: $removed
    }
  ) {
    affected_rows
  }
}
