mutation updateRequestTaskState(
  $id: bigint!
  $state: Int
  $start: timestamptz
  $stop: timestamptz
  $handler: Int
  $recentHandler: Int
  $assignedGroup: String
  ) {
  update_request_reqtask_by_pk(
    pk_columns: { id: $id }
    _set: {
    state_id: $state
    start: $start
    stop: $stop
    current_handler: $handler
    recent_handler: $recentHandler
    assigned_group: $assignedGroup
  }) {
    UpdatedIdLong: id
  }
}
